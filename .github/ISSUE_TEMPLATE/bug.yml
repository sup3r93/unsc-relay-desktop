name: Bug report / Segnala un problema
description: Report a reproducible desktop problem / Segnala un problema riproducibile
title: "[Bug]: "
labels: [bug, "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: "Do not publish security vulnerabilities or real secrets here. Use private security reporting. / Non pubblicare vulnerabilità o segreti reali: usa la segnalazione di sicurezza privata."
  - type: input
    id: version
    attributes:
      label: App version / Versione dell’app
      placeholder: e.g. 0.2.16
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component / Componente
      options: [SSH, SFTP, RDP and VNC, Local terminals, Vault and sign-in, Installer and updates, Interface and accessibility, Audio, Other]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / Ambiente
      description: "Windows version, display scaling and relevant non-sensitive details / Versione Windows, ridimensionamento schermo e dettagli non sensibili"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Passaggi per riprodurre
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Comportamento atteso
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / Comportamento riscontrato
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots / Log o screenshot anonimizzati
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and duplicate check / Privacy e duplicati
      options:
        - label: I searched existing issues / Ho cercato nelle issue esistenti
          required: true
        - label: I removed passwords, keys, tokens and personal data / Ho rimosso password, chiavi, token e dati personali
          required: true
