# Weekly grouped dependency PRs target dev; required checks and manual review still apply.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      github-actions-dependencies:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/apps/desktop"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      nuget-dependencies:
        patterns: ["*"]
