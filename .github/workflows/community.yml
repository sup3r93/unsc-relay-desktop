name: Community PR policy
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]
permissions:
  pull-requests: write
  issues: write
jobs:
  target:
    name: Community PR target
    runs-on: ubuntu-latest
    steps:
      # Metadata only: never check out, download or execute PR code here.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.payload.repository.owner;
            const allowed = pr.base.ref === 'dev' || (pr.base.ref === 'main' && pr.user.id === owner.id);
            if (!allowed) {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number,
                body: 'Community contributions must target **dev**. Please reopen this PR against `dev`. Only the repository owner may propose changes to `main`.\n\nI contributi della community devono essere diretti a **dev**. Riapri la PR verso `dev`: solo il titolare può proporre modifiche a `main`.'});
              await github.rest.pulls.update({...context.repo, pull_number: pr.number, state: 'closed'});
              core.setFailed('Community pull requests must target dev.');
              return;
            }
            core.info(`Accepted target: ${pr.base.ref}`);
