name: Desktop verification
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/check-readmes.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/test-community-policy.cjs
  desktop:
    name: Desktop checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build apps/desktop/UnscRelay.sln --configuration Release
      - name: Check encrypted vault migration
        run: dotnet apps/desktop/tests/UnscRelay.Tests/bin/Release/net10.0/UnscRelay.Tests.dll --cloud-sync-only
      - name: Check account unlock when implemented
        shell: pwsh
        run: |
          if (Test-Path apps/desktop/tests/UnscRelay.Tests/AccountUnlockChecks.cs) {
            dotnet apps/desktop/tests/UnscRelay.Tests/bin/Release/net10.0/UnscRelay.Tests.dll --account-unlock-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  ui:
    name: UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-ui-failures
          path: apps/desktop/test-results
  audit:
    name: Dependency audit
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm audit --audit-level=high --prefix apps/desktop
